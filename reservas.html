    <main>
    <section class="encabezado-reservas banner-oscuro">
    <div class="container-fluid">

        <h1><em>Tu mesa te espera</em></h1>

        <p>te guardamos un lugar para vos</p>

    </div>
</section>

<section class="seccion-formulario">
    <div class="container">

        <h2>Reservá tu lugar</h2>

        <form class="formulario-reservas">
            <div class="row g-4">

                <!-- Nombre -->
                <div class="col-12 col-md-6">
                    <label for="nombre" class="form-label">
                        Nombre
                    </label>

                    <input
                        type="text"
                        id="nombre"
                        name="nombre"
                        class="form-control"
                        autocomplete="given-name"
                        required>
                </div>

                <!-- Apellido -->
                <div class="col-12 col-md-6">
                    <label for="apellido" class="form-label">
                        Apellido
                    </label>

                    <input
                        type="text"
                        id="apellido"
                        name="apellido"
                        class="form-control"
                        autocomplete="family-name"
                        required>
                </div>

                <!-- Correo electrónico -->
                 <div class="col-12 col-md-6">
                     <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    
                    <input
                    type="email"
                    id="correo"
                    name="correo"
                    class="form-control"
                    autocomplete="email"
                    required>
                </div>
                
                <!-- Teléfono -->
                 <div class="col-12 col-md-6">
                    <label for="telefono" class="form-label">
                        Teléfono
                    </label>

                    <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    class="form-control"
                    autocomplete="tel"
                    required>
                </div>

                <!-- Cantidad de personas -->
                 <div class="col-12 col-md-4">
                    <label for="personas" class="form-label">
                        Cantidad de personas
                    </label>
                    
                    <select id="personas" name="personas"
                    class="form-select" required>
                    <option value="">Elegí una opción</option>
                    <option value="1">1 persona</option>
                    <option value="2">2 personas</option>
                    <option value="3">3 personas</option>
                    <option value="4">4 personas</option>
                    <option value="5">5 personas</option>
                    <option value="6">6 personas</option>
                    </select>
                </div>
                
                <!-- Fecha -->
                 <div class="col-12 col-md-4">
                    <label for="fecha" class="form-label">
                        Fecha
                    </label>
                    
                    <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    class="form-control"
                    required>
                </div>

               <!-- Horario -->
                <div class="col-12 col-md-4">
                    <label for="horario" class="form-label">
                        Horario
                    </label>
                    
                    <select id="horario" name="horario"
                    class="form-select" required>
                    <option value="">Elegí un horario</option>
                    <option value="09:00">09:00</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="12:00">12:00</option>
                    <option value="13:00">13:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                    <option value="16:00">16:00</option>
                    <option value="17:00">17:00</option>
                    <option value="18:00">18:00</option>
                    <option value="19:00">19:00</option>
                    </select>
                </div>

                <div class="col-12">
                    <label for="comentarios" class="form-label">Comentarios</label>
                    <textarea
                        id="comentarios"
                        name="comentarios"
                        class="form-control"
                        rows="4"></textarea>
                </div>
                
                <div class="col-12">
                    <button type="submit" class="boton-crema">
                        RESERVAR MESA
                    </button>
                </div>

            </div>
        
            <p id="mensaje-reserva" role="status" class="mt-4 mb-0"></p>
        
        </form>

    </div>
</section>

<section class="antes-de-venir">
    <div class="container">
        <h2>Antes de venir</h2>

        <p>Armenia 3745 (Palermo)</p>
        <p>Martes a domingo · 9 a 20 hs</p>
        <p>Las reservas se mantienen durante 15 minutos.</p>
    </div>
</section>
